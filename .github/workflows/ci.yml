name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path core-rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path core-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path core-rust/Cargo.toml
      - run: cargo build --locked --manifest-path core-rust/Cargo.toml
      - run: npm --prefix extension ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix extension test
      - if: runner.os == 'Windows'
        run: npm --prefix extension run package:windows
